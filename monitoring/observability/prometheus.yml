global:
  scrape_interval: 15s   # Her 15 saniyede bir scrape yapılacak
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'place-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s  # Her 15 saniyede bir scrape yapılacak
    scrape_timeout: 10s   # 15 saniyelik scrape aralığı içinde 10 saniye beklenebilir
    static_configs:
      - targets: ['place-service:8081']
  - job_name: 'favorite-place-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s  # Her 15 saniyede bir scrape yapılacak
    scrape_timeout: 10s   # 15 saniyelik scrape aralığı içinde 10 saniye beklenebilir
    static_configs:
      - targets: [ 'favorite-place-service:8084' ]
  - job_name: 'comment-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'comment-service:8083' ]

  - job_name: 'search-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'search-service:8085' ]

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'user-service:8082' ]
  #//
