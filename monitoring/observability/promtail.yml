server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: "spring-boot"
    static_configs:
      - targets:
          - loki:3100
        labels:
          ##job: "spring-boot"
          job: "spring-boot"
          __path__: C:/log/place-service/*.log

