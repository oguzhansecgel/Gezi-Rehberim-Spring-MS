spring:
  application:
    name: Place
  cloud:
    config:
      profile: prod
  config:
    import: "configserver:${configurl}"
  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: kafka-topic

  redis:
    host: redis_container
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always


configurl: http://configserver:8079


